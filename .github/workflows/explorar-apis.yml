name: Explorar APIs (temporário)

# Execução temporária da fase 07 para registrar o formato real das respostas
# do WoRMS e do GBIF. Será removida antes do pull request.
on:
  push:
    branches: [fase-07-integracoes]
    paths: ['.github/workflows/explorar-apis.yml']

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar e registrar amostras
        run: |
          probe() {
            label="$1"; url="$2"; filter="${3:-.}"
            code=$(curl -sS -o /tmp/body -w '%{http_code} %{content_type}' -H 'Accept: application/json' "$url" || echo "ERRO")
            body=$(jq -c "$filter" /tmp/body 2>/dev/null | head -c 6000 || head -c 3000 /tmp/body)
            msg="URL: $url%0AHTTP: $code%0A$body"
            msg="${msg//$'\n'/%0A}"
            echo "::notice title=$label::$msg"
          }
          W=https://www.marinespecies.org/rest
          G=https://api.gbif.org
          probe 'worms nome exato' "$W/AphiaRecordsByName/Chelonia%20mydas?like=false&marine_only=true" '.[0:2]'
          probe 'worms nome parcial' "$W/AphiaRecordsByName/Carcharodon?like=true&marine_only=true&offset=1" '[.[] | {AphiaID,scientificname,status,rank,valid_AphiaID,valid_name}] | .[0:8]'
          probe 'worms nome inexistente' "$W/AphiaRecordsByName/Inexistentia%20ficticia?like=false&marine_only=true"
          probe 'worms por id' "$W/AphiaRecordByAphiaID/137206"
          probe 'worms vernaculares' "$W/AphiaVernacularsByAphiaID/137206" '[.[] | select(.language_code=="por" or .language_code=="eng")]'
          probe 'worms classificacao' "$W/AphiaClassificationByAphiaID/137206" '[recurse(.child; . != null) | {AphiaID,rank,scientificname}]'
          probe 'worms sinonimo' "$W/AphiaRecordsByName/Chelonia%20agassizii?like=false&marine_only=false" '[.[] | {AphiaID,scientificname,status,unacceptreason,valid_AphiaID,valid_name}]'
          probe 'gbif v1 match' "$G/v1/species/match?name=Chelonia%20mydas&verbose=true" 'del(.alternatives)'
          probe 'gbif v1 match ambiguo' "$G/v1/species/match?name=Carcharodon&verbose=true" '{usageKey,matchType,confidence,rank,status,note, alternatives: [.alternatives[]? | {usageKey,scientificName,rank,status,confidence,matchType}][0:5]}'
          probe 'gbif v1 match inexistente' "$G/v1/species/match?name=Inexistentia%20ficticia"
          probe 'gbif v2 match' "$G/v2/species/match?scientificName=Chelonia%20mydas"
          probe 'gbif v1 search' "$G/v1/species/search?q=Chelonia%20mydas&rank=SPECIES&limit=3" '{count, results: [.results[] | {key,nubKey,datasetKey,scientificName,canonicalName,rank,taxonomicStatus,acceptedKey}]}'
          probe 'gbif v1 usage' "$G/v1/species/5279397" 
          probe 'gbif vernaculares' "$G/v1/species/5279397/vernacularNames?limit=100" '[.results[] | select(.language=="por" or .language=="eng") | {vernacularName,language,source}] | .[0:10]'
