name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificação (segredos, formato, lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verificar segredos
        run: node scripts/check-secrets.mjs

      - name: Exigir package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json ausente. Gere o arquivo pelo workflow 'Gerar lockfile'."
            exit 1
          fi

      - name: Instalar dependências (versões exatas do lockfile)
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      - name: Lint
        run: scripts/ci-run.sh 'Lint' npm run lint

      - name: Checagem de tipos
        run: scripts/ci-run.sh 'Checagem de tipos' npm run typecheck

      - name: Testes
        run: scripts/ci-run.sh 'Testes' npm run test

      - name: Build de produção
        run: scripts/ci-run.sh 'Build de produção' npm run build

  contract:
    name: Contrato das APIs externas (não bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Instabilidade do WoRMS ou do GBIF não deve bloquear o desenvolvimento;
    # o resultado aparece como aviso na execução.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Testes de contrato (WoRMS e GBIF reais)
        env:
          RUN_CONTRACT_TESTS: '1'
        run: scripts/ci-run.sh 'contrato das APIs' npm run test:contract
