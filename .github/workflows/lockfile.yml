name: Gerar lockfile

# Gera ou atualiza o package-lock.json a partir do package.json e grava o
# resultado na própria branch. Roda automaticamente quando o package.json
# muda numa branch que não seja a main, e pode ser disparado manualmente.
on:
  push:
    branches-ignore: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Gerar package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Gravar o lockfile na branch, se mudou
        run: |
          if git diff --quiet --exit-code -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: atualiza package-lock.json"
          git push
