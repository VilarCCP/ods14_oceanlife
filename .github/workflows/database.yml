name: Banco de dados

# Aplica todas as migrações num Supabase local (no próprio runner do GitHub,
# que tem Docker) e roda os testes pgTAP de restrições, RLS e Storage.
on:
  push:
    branches: ['**']
    paths:
      - 'supabase/**'
      - 'src/**'
      - 'tests/integration/**'
      - 'package-lock.json'
      - '.github/workflows/database.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/**'
      - 'tests/integration/**'
      - 'package-lock.json'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrações e testes do banco
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Para gravar os tipos gerados na própria branch (nunca na main).
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar a CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Iniciar o Supabase local
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime

      - name: Recriar o banco do zero (migrações + seed fictício)
        id: reset
        run: scripts/ci-run.sh 'db reset' supabase db reset

      - name: Gerar tipos TypeScript a partir do esquema
        run: |
          mkdir -p src/types
          if ! supabase gen types typescript --local --schema public > src/types/database.ts 2> /tmp/gen-types.err; then
            msg="$(tail -n 60 /tmp/gen-types.err)"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=gen types::$msg"
            exit 1
          fi
          head -n 5 src/types/database.ts

      - name: Conferir tipos (grava na branch se mudaram; falha na main e em PRs)
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git ls-files --error-unmatch src/types/database.ts >/dev/null 2>&1 \
             && git diff --quiet --exit-code -- src/types/database.ts; then
            echo "Tipos do banco atualizados."
            exit 0
          fi
          if [ "$EVENT" = "push" ] && [ "$BRANCH" != "main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/types/database.ts
            git commit -m "chore: atualiza tipos do banco (src/types/database.ts)"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
            echo "::notice title=Tipos do banco::src/types/database.ts foi atualizado na branch $BRANCH."
          else
            echo "::error title=Tipos do banco desatualizados::Rode o workflow numa branch para regenerar src/types/database.ts."
            exit 1
          fi

      - name: Lint do SQL (plpgsql_check)
        run: scripts/ci-run.sh 'db lint' supabase db lint --level error --fail-on error

      - name: Testes do banco (pgTAP)
        # Roda mesmo se o lint falhar, para mostrar os dois resultados.
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: scripts/ci-run.sh 'test db' supabase test db

      - name: Configurar Node.js
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Instalar dependências
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: npm ci

      - name: Exportar endereço e chaves do Supabase LOCAL para os testes
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: |
          supabase status -o json > /tmp/status.json
          echo "::notice title=Chaves disponíveis::$(jq -r 'keys | join(", ")' /tmp/status.json)"
          url=$(jq -r '.API_URL // empty' /tmp/status.json)
          pub=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY // empty' /tmp/status.json)
          sec=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY // empty' /tmp/status.json)
          if [ -z "$url" ] || [ -z "$pub" ] || [ -z "$sec" ]; then
            echo "::error title=Supabase local::Não foi possível ler URL e chaves de 'supabase status'."
            exit 1
          fi
          echo "::add-mask::$pub"
          echo "::add-mask::$sec"
          {
            echo "SUPABASE_TEST_URL=$url"
            echo "SUPABASE_TEST_PUBLISHABLE_KEY=$pub"
            echo "SUPABASE_TEST_SECRET_KEY=$sec"
          } >> "$GITHUB_ENV"

      - name: Testes de integração (serviços contra a API real)
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        env:
          REQUIRE_INTEGRATION_TESTS: '1'
        run: scripts/ci-run.sh 'testes de integração' npm run test:integration

      - name: Parar o Supabase local
        if: always()
        run: supabase stop --no-backup
