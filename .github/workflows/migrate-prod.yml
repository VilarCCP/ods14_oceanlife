name: Aplicar migrações (Supabase de PRODUÇÃO)

# Disparo manual apenas (aba Actions → este workflow → Run workflow).
# Por padrão faz só uma simulação (dry run) e lista o que seria aplicado.
# A simulação roda em qualquer branch; a aplicação real, só a partir da main.
#
# Conecta direto no banco pelo pooler do Supabase (modo sessão, IPv4), sem usar
# token de conta: o workflow só tem acesso a este banco.
#
# Configuração (Settings → Secrets and variables → Actions):
#   Variável SUPABASE_PROD_PROJECT_REF   identificador do projeto de produção (não é segredo)
#   Segredo  SUPABASE_PROD_DB_PASSWORD   senha do banco do projeto de PRODUÇÃO
#   Variável SUPABASE_PROD_POOLER_HOST   opcional; padrão: tenta aws-0 e aws-1 em sa-east-1
#
# O seed.sql NUNCA é aplicado em produção: contém apenas dados fictícios.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Aplicar de verdade em PRODUÇÃO? (desmarcado = apenas simular)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (produção)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      POOLER_HOST: ${{ vars.SUPABASE_PROD_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir configuração
        run: |
          missing=0
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "::error::Defina a variável SUPABASE_PROD_PROJECT_REF."; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Defina o segredo SUPABASE_PROD_DB_PASSWORD."; missing=1; }
          if [ "$SUPABASE_PROJECT_REF" = "yizuyqmqdiwtmijohrrj" ]; then
            echo "::error::SUPABASE_PROD_PROJECT_REF aponta para o projeto de desenvolvimento."; missing=1
          fi
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Montar a conexão com o banco
        run: |
          password=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$password"
          errors=""
          hosts="${POOLER_HOST:-aws-0-sa-east-1.pooler.supabase.com aws-1-sa-east-1.pooler.supabase.com}"
          for host in $hosts; do
            url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${password}@${host}:5432/postgres"
            if psql "$url" -tAc 'select 1' >/tmp/psql.txt 2>&1; then
              echo "::notice title=Conexão::Conectado ao banco de produção por ${host}."
              echo "DB_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            errors="${errors}%0A${host}: $(tr '\n' ' ' < /tmp/psql.txt | head -c 300)"
          done
          echo "::error title=Conexão::Não foi possível conectar ao banco de produção.${errors}%0AConfira a senha (SUPABASE_PROD_DB_PASSWORD) e, se preciso, defina SUPABASE_PROD_POOLER_HOST com o host do Session pooler mostrado em Connect no painel do Supabase."
          exit 1

      - name: Simular (dry run)
        run: |
          set -o pipefail
          scripts/ci-run.sh 'Simulação' supabase db push --db-url "$DB_URL" --dry-run | tee /tmp/dry-run.txt
          summary="$(grep -vE '^\s*$' /tmp/dry-run.txt | tail -n 40)"
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::notice title=Simulação (nada foi aplicado)::${summary}"

      - name: Recusar aplicação fora da main
        if: ${{ inputs.apply && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Produção só recebe migrações a partir da main. Rode de novo escolhendo a main."
          exit 1

      - name: Aplicar migrações
        if: ${{ inputs.apply && github.ref == 'refs/heads/main' }}
        run: scripts/ci-run.sh 'Aplicar migrações' supabase db push --db-url "$DB_URL"
